server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS DYNAMIQUE du backend (DNS embarqué Docker) : nginx re-résout
    # « backend » à chaque requête → survit à une recréation du conteneur backend
    # (évite le 502 « upstream stale » quand le backend change d'IP interne).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend;

    # ── Health check backend ─────────────────────────────────────
    # /health est à la racine du backend (hors /api/)
    location = /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Proxy API → backend ──────────────────────────────────────
    # Le frontend appelle /api/* en relatif.
    # Nginx redirige vers le service backend Docker.
    # Cela évite de bake l'IP du NAS dans le build frontend.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE (Server-Sent Events) — génération de rapports en streaming
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;   # 10 min pour Mixtral
        proxy_send_timeout 600s;

        # Upload de fichiers volumineux
        client_max_body_size 512m;
    }

    # ── Cache des assets statiques (bundles Vite hashés = contenu stable) ──
    # Placé AVANT « location / » : les fichiers hashés (main-<hash>.js…) sont
    # sûrs à cacher 1 an. À un nouveau déploiement, leur nom change → nouvelle
    # URL → le navigateur récupère les nouveaux sans purge.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA : toutes les routes → index.html ────────────────────
    # ⚠ Le fallback SPA (/, /wiki/…) est servi ICI, PAS via « = /index.html »
    # (try_files n'entre pas dans cette location). C'est donc ICI qu'on interdit
    # le cache du HTML → à chaque déploiement, le navigateur récupère le nouvel
    # index.html (qui pointe vers les nouveaux bundles hashés) SANS Ctrl+Shift+R.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/event-stream;
}
